<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Confirmed — AS Invoice Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@700;800&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--m:#7A1535;--dm:#5C0F28;--g:#C9A844;--gl:#E8D8A8;--t:#3A2A24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',sans-serif;background:#F3EBE5;color:var(--t);
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(92,15,40,.14);
 max-width:460px;width:100%;overflow:hidden;text-align:center}
.top{background:var(--dm);padding:26px 24px 22px}
.brand{font-family:'Cinzel',serif;font-weight:700;font-size:19px;color:var(--g);letter-spacing:1.5px}
.sub{font-size:8.5px;letter-spacing:3px;color:rgba(255,255,255,.45);margin-top:5px}
.body{padding:30px 28px 28px}

.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:flex;
 align-items:center;justify-content:center;position:relative}
.mark.ok{background:#E8F5E9}
.mark.bad{background:#FDECEA}
.mark.wait{background:#FFF8EC}
.mark svg{width:38px;height:38px}
.tick{stroke:#2E7D32;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none;
 stroke-dasharray:36;stroke-dashoffset:36;animation:draw .5s .15s ease-out forwards}
.ring{stroke:#2E7D32;stroke-width:2.5;fill:none;opacity:.25;
 stroke-dasharray:170;stroke-dashoffset:170;animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tick,.ring{animation:none;stroke-dashoffset:0}}

h1{font-family:'Playfair Display',serif;font-size:23px;color:var(--dm);margin-bottom:10px;line-height:1.3}
p{font-size:13px;color:#6B5A52;line-height:1.75}
p+p{margin-top:10px}
.email{display:inline-block;background:#FFF9F0;border:1.5px solid var(--gl);border-radius:7px;
 padding:7px 13px;margin:14px 0 4px;font-size:12.5px;font-weight:700;color:var(--dm);
 word-break:break-all}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:9px;margin-top:20px;
 font-family:'Open Sans',sans-serif;font-size:13.5px;font-weight:800;cursor:pointer;
 text-decoration:none;transition:background .15s}
.btn.main{background:var(--g);color:var(--dm)}
.btn.main:hover{background:#D4B54E}
.btn.ghost{background:#fff;color:var(--m);border:1.5px solid #E0D5CF;margin-top:10px}
.btn.ghost:hover{background:#FAF5F2}
.btn:disabled{opacity:.6;cursor:default}
.note{font-size:11px;color:#A08878;margin-top:18px;line-height:1.6}
.note a{color:var(--m)}
.msg{font-size:12px;border-radius:7px;padding:10px 12px;margin-top:14px;line-height:1.6;display:none}
.msg.ok{background:#F1F8F2;border:1px solid #CFE6D2;color:#2E7D32;display:block}
.msg.err{background:#FDF1F0;border:1px solid #F0CFCB;color:#96281B;display:block}
.spin{width:30px;height:30px;border:3px solid #EADFD7;border-top-color:var(--g);
 border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{border-top:1px solid #F0E8E0;padding:14px;font-size:10px;color:#BBB;letter-spacing:.3px}
.foot b{color:rgba(201,168,68,.9);font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">AS INVOICE GENERATOR</div>
    <div class="sub">BILLING &amp; INVENTORY</div>
  </div>

  <div class="body" id="body">
    <div class="mark wait"><div class="spin"></div></div>
    <h1>Checking your link…</h1>
    <p>One moment.</p>
  </div>

  <div class="foot">Powered by <b>AS Bridal Bangles &amp; Accessories</b></div>
</div>

<script>
var SB_HOST='https://tgvuoesnzolpjppyrage.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRndnVvZXNuem9scGpwcHlyYWdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzA4NTEsImV4cCI6MjEwMjMwNjg1MX0.X5xtjuyR17ySI8AqcZ4XI-bImNpuRVoqt92zi2w1P38';
var APP='index.html';   /* change if the app sits at another path */

function qs(o){var r='';for(var k in o)r+=(r?'&':'')+k+'='+encodeURIComponent(o[k]);return r;}

/* Supabase answers in the hash on the implicit flow and in the query on
   errors and the PKCE flow, so read both. */
function params(){
 var out={};
 [location.hash.replace(/^#/,''),location.search.replace(/^\?/,'')].forEach(function(src){
  if(!src)return;
  src.split('&').forEach(function(pair){
   if(!pair)return;
   var i=pair.indexOf('=');
   var k=decodeURIComponent(i<0?pair:pair.slice(0,i));
   var v=i<0?'':decodeURIComponent(pair.slice(i+1).replace(/\+/g,' '));
   if(out[k]===undefined)out[k]=v;});});
 return out;}

function render(html){document.getElementById('body').innerHTML=html;}

var TICK='<div class="mark ok"><svg viewBox="0 0 52 52">'+
 '<circle class="ring" cx="26" cy="26" r="24"/>'+
 '<path class="tick" d="M15 27l8 8 15-16"/></svg></div>';
var CROSS='<div class="mark bad"><svg viewBox="0 0 52 52">'+
 '<circle cx="26" cy="26" r="24" fill="none" stroke="#C0392B" stroke-width="2.5" opacity=".25"/>'+
 '<path d="M18 18l16 16M34 18L18 34" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/></svg></div>';
var CLOCK='<div class="mark wait"><svg viewBox="0 0 52 52">'+
 '<circle cx="26" cy="26" r="24" fill="none" stroke="#B07000" stroke-width="2.5" opacity=".25"/>'+
 '<path d="M26 14v13l9 5" stroke="#B07000" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg></div>';

function showSuccess(signedIn,email){
 render(TICK+
  '<h1>Email confirmed</h1>'+
  '<p>Your account is ready'+(signedIn?' and you are signed in':'')+'.</p>'+
  (email?'<div class="email">'+esc(email)+'</div>':'')+
  '<a class="btn main" href="'+APP+'">'+(signedIn?'Open AS Invoice Generator':'Sign in to continue')+'</a>'+
  '<div class="note">Keep this address handy &mdash; it is how you sign in.</div>');}

function showExpired(email){
 render(CLOCK+
  '<h1>This link has expired</h1>'+
  '<p>Confirmation links are valid for a short time. Send yourself a fresh one and open it straight away.</p>'+
  '<input id="em" value="'+esc(email||'')+'" placeholder="you@example.com" '+
   'style="width:100%;padding:11px 13px;border:1.5px solid #E0D5CF;border-radius:8px;'+
   'font-size:13px;margin-top:16px;font-family:\'Open Sans\',sans-serif">'+
  '<button class="btn main" id="rs" onclick="resend()">Send a new link</button>'+
  '<a class="btn ghost" href="'+APP+'">Back to sign in</a>'+
  '<div class="msg" id="m"></div>');}

function showUsed(){
 render(TICK+
  '<h1>Already confirmed</h1>'+
  '<p>This address has been verified. You can sign in whenever you are ready.</p>'+
  '<a class="btn main" href="'+APP+'">Go to sign in</a>');}

function showError(txt){
 render(CROSS+
  '<h1>We could not confirm this link</h1>'+
  '<p>'+esc(txt||'The link may be incomplete. Try opening it again from your email, or sign in to check whether it already worked.')+'</p>'+
  '<a class="btn main" href="'+APP+'">Go to sign in</a>'+
  '<div class="note">Still stuck? Message us on '+
   '<a href="https://wa.me/919342382918" target="_blank" rel="noopener">WhatsApp</a>.</div>');}

function esc(s){return String(s==null?'':s)
 .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function resend(){
 var btn=document.getElementById('rs'),box=document.getElementById('m');
 var email=(document.getElementById('em').value||'').trim();
 if(!email){box.className='msg err';box.textContent='Enter your email address.';return;}
 btn.disabled=true;btn.textContent='Sending…';
 try{
  var r=await fetch(SB_HOST+'/auth/v1/resend',{
   method:'POST',
   headers:{apikey:SB_ANON,'Content-Type':'application/json'},
   body:JSON.stringify({type:'signup',email:email})});
  if(r.ok){
   box.className='msg ok';
   box.textContent='Sent. Check '+email+' — open the new link within the hour.';
  }else{
   var t=await r.text(),j=null;try{j=JSON.parse(t);}catch(e){}
   box.className='msg err';
   box.textContent=(j&&(j.msg||j.message||j.error_description))||'Could not send a new link. Try signing in — the address may already be confirmed.';}
 }catch(e){
  box.className='msg err';
  box.textContent='Network problem. Check your connection and try again.';
 }finally{btn.disabled=false;btn.textContent='Send a new link';}}

(function(){
 var p=params();

 /* Supabase reports failures as error / error_code / error_description */
 if(p.error||p.error_code){
  var code=(p.error_code||'')+' '+(p.error||'')+' '+(p.error_description||'');
  if(/expired|otp_expired/i.test(code)){showExpired(p.email);return;}
  if(/already|confirmed/i.test(code)){showUsed();return;}
  showError(p.error_description||'');
  return;}

 /* implicit flow — tokens arrive in the hash */
 if(p.access_token){
  var sess={access_token:p.access_token,refresh_token:p.refresh_token||'',
   token_type:p.token_type||'bearer',
   expires_in:parseInt(p.expires_in)||3600,
   expires_at:Date.now()+((parseInt(p.expires_in)||3600)*1000)};
  var mail='';
  try{
   var payload=JSON.parse(atob(p.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
   mail=payload.email||'';
   sess.user={id:payload.sub,email:mail};
  }catch(e){}
  /* the app reads this key, so the next page opens already signed in */
  var stored=false;
  try{localStorage.setItem('asig_session',JSON.stringify(sess));stored=true;}catch(e){}
  history.replaceState(null,'',location.pathname);
  showSuccess(stored,mail);
  return;}

 /* PKCE flow — we have no verifier here, so confirm and hand off to sign-in */
 if(p.code){showSuccess(false,'');return;}

 /* opened directly, with nothing attached */
 showError('This page opens from the confirmation link in your email.');
})();
</script>
</body>
</html>
